# Deploy the docs site to Cloudflare Workers.
#
# Automatic deploys run through Cloudflare Workers Builds (the
# cloudflare-workers-and-pages GitHub App): pushes to main build and deploy the
# site, so no GitHub Actions secrets are needed.
#
# This workflow is the manual fallback for environments where Workers Builds is
# not connected. It requires:
#
# Secrets:
#   CLOUDFLARE_API_TOKEN  — Workers Scripts:Edit, plus Zone:Read for the
#                           custom domain (lark-ui.tapeless.eu.org).
#   CLOUDFLARE_ACCOUNT_ID — the account to deploy into. Overrides the default
#                           in packages/lark-docs-astro/cloudflare.config.ts.
#
name: Docs Deploy

on:
  workflow_dispatch:
    inputs:
      mode:
        description: "Deployment target"
        type: choice
        options:
          - production
          - staging
        default: production

permissions:
  contents: read

concurrency:
  group: docs-deploy-${{ github.event.inputs.mode || 'production' }}
  cancel-in-progress: false

jobs:
  deploy:
    name: Deploy Docs
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Dependencies
        uses: ./.github/actions/install-dependencies

      # The docs build imports the built theme config from the library
      # (astro.config.mjs resolves @lark-ui/core through its dist/ exports in
      # production builds), so the library has to be built first.
      - name: Build @lark-ui/core
        run: vp run --filter @lark-ui/core build

      - name: Build docs
        run: vp run --filter @lark-ui/docs-astro build

      - name: Install Cloudflare CLI
        # `cf` is the CLI; `wrangler` provides the `cf-wrangler` delegate that
        # packages the build output into a Build Output Specification.
        run: npm install -g cf wrangler

      - name: Deploy
        run: |
          # `pnpm run` is required: pnpm has a built-in `deploy` command that
          # would otherwise shadow the package script.
          if [ "${{ github.event.inputs.mode }}" = "staging" ]; then
            pnpm --filter @lark-ui/docs-astro run deploy:staging
          else
            pnpm --filter @lark-ui/docs-astro run deploy
          fi
