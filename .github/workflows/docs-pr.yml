name: Docs Checks (PR)

on:
  pull_request:

permissions:
  contents: read

concurrency:
  group: docs-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  build:
    name: Docs Build
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Install Dependencies
        uses: ./.github/actions/install-dependencies

      # The docs build imports the built theme config from the library
      # (astro.config.mjs resolves @lark-ui/core through its dist/ exports in
      # production builds), so the library has to be built first.
      - name: Build @lark-ui/core
        run: vp run --filter @lark-ui/core build

      - uses: ./.github/actions/vite-task-cache

      - name: Build docs
        run: vp run --filter @lark-ui/docs-astro build

      - name: Test docs
        run: vp run --filter @lark-ui/docs-astro test

      - name: Upload docs artifact
        uses: actions/upload-artifact@v4
        with:
          name: docs-preview-dist
          path: packages/lark-docs-astro/dist/
          include-hidden-files: true
          retention-days: 1
