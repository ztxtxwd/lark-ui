name: Package Preview (PR)

on:
  pull_request:
  # Also trigger on push to PR branches (for bots that push via API)
  push:
    branches:
      - "opencode/**"
      - "changeset-release/main"

permissions:
  contents: write
  pull-requests: write

concurrency:
  group: package-preview-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  pkg-preview:
    name: Package Preview
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Install Dependencies
        uses: ./.github/actions/install-dependencies
        with:
          filter: "@lark-ui/core..."

      - uses: ./.github/actions/vite-task-cache
      - name: Build @lark-ui/core
        run: vp run build:lark

      # pkg-pr-new needs its GitHub App installed on the repository
      # (https://github.com/apps/pkg-pr-new/installations/new). Until then this
      # step cannot run — it is non-fatal so the workflow still passes.
      - name: Publish preview package
        continue-on-error: true
        run: vp dlx pkg-pr-new publish --pnpm --compact --no-template ./packages/lark
