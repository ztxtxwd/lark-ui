name: Release

on:
  push:
    branches:
      - main

concurrency:
  group: ${{ github.workflow }}
  cancel-in-progress: false

jobs:
  release:
    permissions:
      id-token: write
      contents: write
      pull-requests: write

    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Install Dependencies
        uses: ./.github/actions/install-dependencies

      - name: Build @lark-ui/core
        run: vp run --filter @lark-ui/core build

      # changesets/action either:
      # 1. Creates/updates a "Version Packages" PR (when changesets exist)
      # 2. Publishes to npm via `vp run release:npm` (when Version Packages PR merges)
      #
      # The publish step uses the npm CLI rather than `changeset publish`:
      # the npm CLI is the only client that implements npm's trusted
      # publishing (OIDC). With a Trusted Publisher configured on npmjs.com
      # for the package — GitHub Actions, this repo, this workflow file — the
      # job's OIDC token is exchanged for a short-lived publish token and no
      # NPM_TOKEN secret is needed.
      #
      # See ci/versioning/publish-npm.sh for the publish step itself.
      - name: Create Version PR or Publish to npm
        id: changesets
        uses: changesets/action@63a615b9cd06ba9a3e6d13796c7fbcb080a60a0b # v1
        with:
          version: vp run version
          publish: vp run release:npm
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          NPM_CONFIG_PROVENANCE: true
          # Changesets shells out to npm for registry lookups. Allow that npm
          # subprocess even though Vite+ configures pnpm as the package manager.
          NPM_CONFIG_FORCE: true

      # Publish pkg-pr-new preview for Version Packages PR
      # (GITHUB_TOKEN PRs don't trigger workflows, so we do it here)
      # pkg-pr-new needs its GitHub App installed on the repository
      # (https://github.com/apps/pkg-pr-new/installations/new). Until then this
      # step cannot run — it is non-fatal so the release job still passes.
      - name: Publish package preview
        if: ${{ steps.changesets.outputs.pullRequestNumber }}
        continue-on-error: true
        run: vp dlx pkg-pr-new publish --pnpm --compact --no-template ./packages/lark
