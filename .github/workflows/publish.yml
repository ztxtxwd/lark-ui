name: Publish

on:
  workflow_dispatch:
  push:
    tags:
      - "v*"

permissions:
  contents: read
  id-token: write # required for npm trusted publishing (OIDC)

concurrency:
  group: npm-publish
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - uses: pnpm/action-setup@v4
        with:
          version: 12.18.0

      - uses: actions/setup-node@v6
        with:
          node-version: "24"
          registry-url: "https://registry.npmjs.org"
          package-manager-cache: false

      - name: Ensure npm supports trusted publishing
        run: npm install -g npm@latest

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build @larkui/core
        run: pnpm --filter @larkui/core build

      - name: Check whether this version is already published
        id: version
        working-directory: packages/core
        run: |
          VERSION=$(node -p "require('./package.json').version")
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          if npm view "@larkui/core@$VERSION" version >/dev/null 2>&1; then
            echo "publish=false" >> "$GITHUB_OUTPUT"
            echo "::notice::@larkui/core@$VERSION is already published; skipping."
          else
            echo "publish=true" >> "$GITHUB_OUTPUT"
          fi

      # pnpm resolves this workspace link locally, but npm would ship the
      # `workspace:*` specifier inside the published manifest.
      - name: Drop workspace-only devDependencies from the published manifest
        if: steps.version.outputs.publish == 'true'
        working-directory: packages/core
        run: npm pkg delete "devDependencies.@larkui/tokens"

      - name: Publish @larkui/core
        if: steps.version.outputs.publish == 'true'
        working-directory: packages/core
        run: npm publish --access public
